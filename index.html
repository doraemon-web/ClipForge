<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClipForge</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080808;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .loader {
      width: 90%;
      max-width: 420px;
      text-align: center;
    }

    .logo {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 28px;
    }

    .spinner {
      width: 32px;
      height: 32px;
      margin: 0 auto 20px;
      border: 3px solid #292929;
      border-top-color: #ff3030;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .status {
      color: #aaa;
      font-size: 15px;
      line-height: 1.5;
    }

    .retry {
      margin-top: 10px;
      color: #666;
      font-size: 13px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div class="loader">
    <div class="logo">ClipForge</div>

    <div class="spinner"></div>

    <div class="status" id="status">
      Checking server...
    </div>

    <div class="retry" id="retry">
      Please wait...
    </div>
  </div>

  <script>
    const URL_FILE =
      "https://raw.githubusercontent.com/doraemon-web/ClipForge/main/tunnel-url.txt";

    const STATUS_FILE =
      "https://raw.githubusercontent.com/doraemon-web/ClipForge/main/server-status.txt";

    const RETRY_DELAY = 5000;

    async function getGitHubFile(url) {
      const response = await fetch(
        url + "?t=" + Date.now(),
        {
          cache: "no-store"
        }
      );

      if (!response.ok) {
        throw new Error("GitHub file unavailable");
      }

      return (await response.text()).trim();
    }

    async function checkServer() {
      const statusElement = document.getElementById("status");
      const retryElement = document.getElementById("retry");

      try {
        statusElement.textContent = "Checking server...";
        retryElement.textContent = "Please wait...";

        const status = await getGitHubFile(STATUS_FILE);

        if (status !== "ONLINE") {
          statusElement.textContent = "Server is down";
          retryElement.textContent =
            "We'll try to reconnect in 5 seconds...";

          setTimeout(checkServer, RETRY_DELAY);
          return;
        }

        statusElement.textContent = "Server online";
        retryElement.textContent = "Opening ClipForge...";

        const url = await getGitHubFile(URL_FILE);

        if (
          !url.startsWith("https://") ||
          !url.includes(".trycloudflare.com")
        ) {
          throw new Error("Invalid tunnel URL");
        }

        setTimeout(() => {
          window.location.replace(url);
        }, 300);

      } catch (error) {
        statusElement.textContent = "Server is down";
        retryElement.textContent =
          "We'll try to reconnect in 5 seconds...";

        setTimeout(checkServer, RETRY_DELAY);
      }
    }

    checkServer();
  </script>

</body>
</html>
