<html lang="en">
<head>
  <meta charset="UTF-8">

  <style>
    * {
      box-sizing: <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClipForge</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080808;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .loader {
      width: 90%;
      max-width: 430px;
      text-align: center;
    }

    .logo {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 30px;
      letter-spacing: -0.5px;
    }

    .spinner {
      width: 34px;
      height: 34px;
      margin: 0 auto 22px;
      border: 3px solid #292929;
      border-top-color: #ff3030;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .status {
      color: #aaa;
      font-size: 16px;
      line-height: 1.5;
    }

    .retry {
      margin-top: 9px;
      color: #666;
      font-size: 13px;
      line-height: 1.5;
    }

    .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 6px;
      border-radius: 50%;
      background: #777;
      vertical-align: middle;
    }

    .online {
      background: #4caf50;
    }

    .offline {
      background: #ff3030;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div class="loader">

    <div class="logo">ClipForge</div>

    <div class="spinner" id="spinner"></div>

    <div class="status" id="status">
      Checking server...
    </div>

    <div class="retry" id="retry">
      Please wait...
    </div>

  </div>

  <script>
    const URL_FILE =
      "https://raw.githubusercontent.com/doraemon-web/ClipForge/main/tunnel-url.txt";

    const STATUS_FILE =
      "https://raw.githubusercontent.com/doraemon-web/ClipForge/main/server-status.txt";

    const RETRY_DELAY = 5000;

    let redirecting = false;

    function setStatus(message, retryMessage, state) {
      const status = document.getElementById("status");
      const retry = document.getElementById("retry");
      const spinner = document.getElementById("spinner");

      status.textContent = message;
      retry.textContent = retryMessage;

      spinner.style.display =
        state === "online" ? "none" : "block";
    }

    async function readFile(url) {
      const response = await fetch(
        url + "?t=" + Date.now(),
        {
          cache: "no-store"
        }
      );

      if (!response.ok) {
        throw new Error("File unavailable");
      }

      return (await response.text()).trim();
    }

    async function checkClipForge() {

      if (redirecting) {
        return;
      }

      try {

        setStatus(
          "Checking server...",
          "Please wait...",
          "checking"
        );

        const serverStatus = await readFile(STATUS_FILE);

        const status = serverStatus.toUpperCase();

        /*
         * SERVER STARTING
         */
        if (status === "STARTING") {

          setStatus(
            "Starting ClipForge...",
            "We'll check again in 5 seconds...",
            "starting"
          );

          setTimeout(checkClipForge, RETRY_DELAY);
          return;
        }

        /*
         * SERVER OFFLINE
         */
        if (status === "OFFLINE") {

          setStatus(
            "Server is down",
            "We'll try to reconnect in 5 seconds...",
            "offline"
          );

          setTimeout(checkClipForge, RETRY_DELAY);
          return;
        }

        /*
         * UNKNOWN STATUS
         *
         * Don't redirect.
         * Don't immediately declare the server dead.
         */
        if (status !== "ONLINE") {

          setStatus(
            "Checking server...",
            "We'll check again in 5 seconds...",
            "checking"
          );

          setTimeout(checkClipForge, RETRY_DELAY);
          return;
        }

        /*
         * SERVER IS ONLINE
         */
        const url = await readFile(URL_FILE);

        if (
          !url.startsWith("https://") ||
          !url.includes(".trycloudflare.com")
        ) {
          throw new Error("Invalid tunnel URL");
        }

        redirecting = true;

        setStatus(
          "Server online",
          "Opening ClipForge...",
          "online"
        );

        setTimeout(() => {
          window.location.replace(url);
        }, 500);

      } catch (error) {

        /*
         * GitHub hasn't updated yet,
         * or the file is temporarily unavailable.
         *
         * Don't send the user to an old URL.
         */

        setStatus(
          "Checking server...",
          "We'll try again in 5 seconds...",
          "checking"
        );

        setTimeout(checkClipForge, RETRY_DELAY);
      }
    }

    checkClipForge();
  </script>

</body>
</html>
